name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check and Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Check
        run: vp check

      - name: Pack
        run: vp pack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist
            types
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.runner.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: Jest
            command: vp run test
          - name: Vitest
            command: vpr vitest --run
          - name: Rstest
            command: vpr rstest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Run ${{ matrix.runner.name }}
        run: ${{ matrix.runner.command }}
        env:
          FORCE_COLOR: 1

  tests_dist:
    name: Tests on dist (${{ matrix.runner.name }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        runner:
          - name: Jest
            command: vp run test:dist
          - name: Vitest
            command: vpr vitest:dist --run
          - name: Rstest
            command: vpr rstest:dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Run ${{ matrix.runner.name }}
        run: ${{ matrix.runner.command }}
        env:
          FORCE_COLOR: 1
