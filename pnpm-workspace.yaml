packages:
  - website
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false
  unrs-resolver: false

catalog:
  typescript: ~7.0.2
  "@vitest/expect": 5.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0

minimumReleaseAgeExclude:
  - "@vitest/expect@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/pretty-format@5.0.0"
  - "@vitest/spy@5.0.0"
  - "@vitest/utils@5.0.0"
  - vitest@5.0.0

patchedDependencies:
  "@docusaurus/tsconfig": patches/@docusaurus__tsconfig.patch
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
