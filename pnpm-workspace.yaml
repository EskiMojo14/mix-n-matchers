packages:
  - website
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false
  unrs-resolver: false

catalog:
  typescript: ~7.0.2

minimumReleaseAgeExclude:
  - "@vitest/expect@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/pretty-format@5.0.0"
  - "@vitest/spy@5.0.0"
  - "@vitest/utils@5.0.0"
  - vitest@5.0.0

patchedDependencies:
  "@docusaurus/tsconfig": patches/@docusaurus__tsconfig.patch
