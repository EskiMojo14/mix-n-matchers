packages:
  - website
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false
  unrs-resolver: false

catalog:
  typescript: ~7.0.2

minimumReleaseAgeExclude:
  - "@rsbuild/core@2.1.6"
  - "@rstest/core@0.11.2"

patchedDependencies:
  "@docusaurus/tsconfig": patches/@docusaurus__tsconfig.patch
